name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux-x86_64:
    name: Tests, one-file build and Docker smoke (Linux x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Check shell syntax
        run: sh -n scripts/install.sh scripts/source-version-retention.sh scripts/build-release.sh scripts/make-onefile.sh scripts/asset-pins.sh scripts/smoke-docker.sh
      - name: Run launcher unit tests
        working-directory: packaging/launcher
        run: go test ./...
      - name: Run Python tests and one-file fixture tests
        run: python3 -m unittest discover -s tests -v
      - name: Build one-file release artifact
        run: sh scripts/build-release.sh
      - name: Verify artifact in Docker
        run: sh scripts/smoke-docker.sh dist/disk-cleanup-agent-linux-x86_64
      - name: Verify release checksum and size
        run: |
          cd dist
          sha256sum -c disk-cleanup-agent-linux-x86_64.sha256
          test "$(stat -c %s disk-cleanup-agent-linux-x86_64)" -lt 2147483648
